<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倒數月曆</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --ink:#2b2a28; --muted:#8a857c;
    --accent:#d9534f; --accent-soft:#fbe4e2; --line:#e7e1d8; --done:#c9c3b9;
    --range:#fff4d6; --crossed:#efe9df;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1b1a; --card:#262523; --ink:#eeeae4; --muted:#9c968c;
      --accent:#ff7a70; --accent-soft:#4a2a28; --line:#3a3835; --done:#5d5953;
      --range:#3b3422; --crossed:#302e2b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:520px}
  .card{background:var(--card);border-radius:18px;padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:16px}
  h1{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 4px;letter-spacing:.05em}
  .event{font-size:24px;font-weight:700;margin:0 0 16px}
  .big{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
  .big .num{font-size:72px;font-weight:800;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
  .big .unit{font-size:20px;color:var(--muted)}
  .clock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .clock div{background:var(--accent-soft);border-radius:12px;padding:10px;text-align:center}
  .clock b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
  .clock span{font-size:12px;color:var(--muted)}
  .done-msg{font-size:28px;font-weight:700;color:var(--accent)}

  /* 問候 */
  .hello{display:flex;align-items:center;gap:8px;margin:4px 4px 16px;min-height:44px}
  .hello h2{margin:0;font-size:30px;font-weight:800;letter-spacing:.01em}
  .hello h2 .who{color:#5b8fd6}
  .hello input{width:auto;max-width:200px;font-size:24px;font-weight:700;padding:4px 10px}
  .icon-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;
    height:34px;padding:0 10px;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .icon-btn:hover{color:var(--ink)}

  /* 吉祥物 */
  .top{position:relative}
  .top h1,.top .event{padding-right:104px}
  .mascot{position:absolute;top:10px;right:12px;width:96px;text-align:center}
  .mascot svg{width:96px;height:96px;cursor:pointer;overflow:visible}
  .mascot .body{transform-origin:50% 90%;animation:sway 3s ease-in-out infinite}
  .mascot.happy .body{animation:hop .5s ease-out 3}
  .mascot .eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
  .bubble{position:absolute;right:88px;top:4px;background:var(--accent-soft);color:var(--ink);
    font-size:13px;padding:8px 11px;border-radius:14px 14px 4px 14px;white-space:nowrap;
    opacity:0;transform:translateY(4px);transition:.3s;pointer-events:none}
  .bubble.show{opacity:1;transform:none}
  .nametag{display:inline-block;margin-top:2px;padding:2px 12px;border-radius:999px;
    background:#5b8fd6;color:#fff;font-size:13px;font-weight:700;letter-spacing:.1em}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) scaleY(1.05)}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .snowfx{position:fixed;top:-10px;color:#bcd7ee;pointer-events:none;z-index:20;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
  .barlabel{font-size:12px;color:var(--muted);margin-top:6px}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .cal-head h2{margin:0;font-size:18px}
  .cal-head button{background:none;border:1px solid var(--line);color:var(--ink);
    width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .dow{font-size:12px;color:var(--muted);padding:4px 0}
  .day{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;border-radius:10px;font-size:15px;user-select:none}
  .day small{font-size:9px;color:var(--muted);line-height:1}
  .day.range{background:var(--range)}
  .day.clickable{cursor:pointer}
  .day.clickable:hover{filter:brightness(.95)}
  .day.crossed{background:var(--crossed);color:var(--done)}
  .day.crossed small{visibility:hidden}
  .day svg{position:absolute;inset:8%;width:84%;height:84%;pointer-events:none}
  .day svg polyline{fill:none;stroke:#5b8fd6;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .day.today{outline:2px solid var(--ink);font-weight:700}
  .day.target{background:var(--accent);color:#fff;font-weight:700}
  .day.target small{color:#fff}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* 畫叉視窗 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal.open{display:flex}
  .sheet{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:360px;text-align:center}
  .sheet h3{margin:0 0 4px;font-size:18px}
  .sheet p{margin:0 0 12px;font-size:13px;color:var(--muted)}
  .pad{position:relative;width:100%;aspect-ratio:1;border-radius:16px;background:var(--range);
    border:2px dashed var(--line);overflow:hidden}
  .pad .bgnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:140px;font-weight:800;color:var(--done);opacity:.5;pointer-events:none}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .btns button{padding:11px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font-size:15px;font-family:inherit;cursor:pointer}
  .btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="hello" id="hello">
    <h2 id="helloText">Hi <span class="who" id="who"></span> !</h2>
    <button class="icon-btn" id="editName" aria-label="編輯名字">✎ 編輯</button>
  </div>
  <div class="card top">
    <div class="mascot" id="mascot">
      <div class="bubble" id="bubble"></div>
      <svg viewBox="0 0 100 100" aria-label="吉祥物">
        <g class="body">
          <ellipse cx="50" cy="94" rx="26" ry="4" fill="#000" opacity=".08"/>
          <!-- 手套 -->
          <circle cx="17" cy="64" r="7" fill="#5b8fd6"/>
          <circle cx="83" cy="64" r="7" fill="#5b8fd6"/>
          <!-- 身體 -->
          <circle cx="50" cy="60" r="33" fill="#fdfdfd" stroke="#dfe7ef" stroke-width="2"/>
          <!-- 毛線帽 -->
          <path d="M22 44 Q50 2 78 44 Z" fill="#e0605a"/>
          <rect x="20" y="40" width="60" height="9" rx="4.5" fill="#f3f0ea"/>
          <circle cx="50" cy="12" r="7" fill="#f3f0ea"/>
          <path d="M34 30 L38 40 M50 24 L50 40 M66 30 L62 40" stroke="#c94b46" stroke-width="2" stroke-linecap="round"/>
          <!-- 臉 -->
          <ellipse class="eye" cx="40" cy="60" rx="3.2" ry="4" fill="#2b2a28"/>
          <ellipse class="eye" cx="60" cy="60" rx="3.2" ry="4" fill="#2b2a28"/>
          <circle cx="33" cy="68" r="4.5" fill="#f7b6b0" opacity=".8"/>
          <circle cx="67" cy="68" r="4.5" fill="#f7b6b0" opacity=".8"/>
          <path d="M45 68 Q50 73 55 68" stroke="#2b2a28" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <!-- 圍巾 -->
          <path d="M24 80 Q50 90 76 80 L74 86 Q50 96 26 86 Z" fill="#5b8fd6"/>
          <rect x="62" y="84" width="9" height="14" rx="3" fill="#5b8fd6" transform="rotate(-10 66 90)"/>
        </g>
      </svg>
      <div class="nametag">Snow</div>
    </div>
    <h1>距離</h1>
    <p class="event" id="eventName"></p>
    <div id="countWrap">
      <div class="big"><span class="num" id="days">0</span><span class="unit">天</span></div>
      <div class="clock">
        <div><b id="hrs">00</b><span>時</span></div>
        <div><b id="mins">00</b><span>分</span></div>
        <div><b id="secs">00</b><span>秒</span></div>
      </div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="barlabel" id="barLabel"></div>
  </div>

  <div class="card">
    <div class="cal-head">
      <button id="prev" aria-label="上個月">‹</button>
      <h2 id="monthTitle"></h2>
      <button id="next" aria-label="下個月">›</button>
    </div>
    <p class="hint">點一下今天（或之前的日子），畫個 ✕ 就能劃掉</p>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span style="--c:var(--crossed)">已過（已打叉）</span>
      <span style="--c:var(--range)">倒數中</span>
      <span style="--c:var(--accent)">目標日</span>
    </div>
  </div>

  <div class="card">
    <h1>設定</h1>
    <label for="inName">事件名稱</label>
    <input id="inName" type="text">
    <div class="row">
      <div><label for="inStart">開始日期</label><input id="inStart" type="date"></div>
      <div><label for="inDate">目標日期</label><input id="inDate" type="date"></div>
    </div>
    <label for="inTime">目標時間</label>
    <input id="inTime" type="time">
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="padTitle"></h3>
    <p>用滑鼠或手指畫一個 ✕</p>
    <div class="pad">
      <div class="bgnum" id="padNum"></div>
      <canvas id="canvas"></canvas>
    </div>
    <div class="btns">
      <button id="btnCancel">取消</button>
      <button id="btnClear">清除</button>
      <button id="btnDone" class="primary">完成</button>
    </div>
  </div>
</div>

<script>
const KEY = "countdown-calendar-v1";
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

let state = { name: "2027 新年", start: ymd(new Date()), date: "2027-01-01", time: "00:00", marks: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.date) state = { ...state, ...s }; } catch (e) {}
if (!state.marks) state.marks = {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const $ = id => document.getElementById(id);
const target = () => new Date(`${state.date}T${state.time || "00:00"}`);
let view = new Date();

function tick() {
  const now = new Date(), t = target();
  $("eventName").textContent = state.name || "目標日";
  const crossedCount = Object.keys(state.marks).length;
  if (t - now <= 0) {
    $("countWrap").innerHTML = '<div class="done-msg">🎉 時間到了！</div>';
    $("barFill").style.width = "100%";
    $("barLabel").textContent = `倒數完成・共劃掉 ${crossedCount} 天`;
    return;
  }
  if (!$("days")) location.reload();
  const s = Math.floor((t - now) / 1000);
  $("days").textContent = Math.floor(s / 86400);
  $("hrs").textContent = pad2(Math.floor(s % 86400 / 3600));
  $("mins").textContent = pad2(Math.floor(s % 3600 / 60));
  $("secs").textContent = pad2(s % 60);
  const start = new Date(`${state.start}T00:00`);
  const total = t - start;
  const pct = total > 0 ? Math.min(100, Math.max(0, (now - start) / total * 100)) : 0;
  $("barFill").style.width = pct.toFixed(1) + "%";
  $("barLabel").textContent = `已經過 ${pct.toFixed(1)}%・已劃掉 ${crossedCount} 天`;
}

const strokesToSvg = strokes =>
  `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${strokes.map(s =>
    `<polyline points="${s.map(p => `${(p[0]*100).toFixed(1)},${(p[1]*100).toFixed(1)}`).join(" ")}"/>`).join("")}</svg>`;

function renderCal() {
  const y = view.getFullYear(), m = view.getMonth();
  $("monthTitle").textContent = `${y} 年 ${m + 1} 月`;
  const g = $("grid"); g.innerHTML = "";
  "日一二三四五六".split("").forEach(d => g.insertAdjacentHTML("beforeend", `<div class="dow">${d}</div>`));
  const first = new Date(y, m, 1).getDay(), count = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) g.insertAdjacentHTML("beforeend", "<div></div>");
  const today = dayStart(new Date()), tgt = dayStart(target()), st = dayStart(new Date(`${state.start}T00:00`));
  for (let d = 1; d <= count; d++) {
    const cur = new Date(y, m, d), key = ymd(cur), cls = ["day"];
    let note = "";
    const mark = state.marks[key];
    if (cur.getTime() === tgt.getTime()) { cls.push("target"); note = "🎯"; }
    else if (cur >= st && cur < tgt) { cls.push("range"); note = `剩${Math.round((tgt - cur) / 86400000)}`; }
    if (cur <= today) cls.push("clickable");
    if (mark) cls.push("crossed");
    if (cur.getTime() === today.getTime()) cls.push("today");
    g.insertAdjacentHTML("beforeend",
      `<div class="${cls.join(" ")}" data-key="${key}">${d}${note ? `<small>${note}</small>` : ""}${mark ? strokesToSvg(mark) : ""}</div>`);
  }
}

$("grid").addEventListener("click", e => {
  const cell = e.target.closest(".day.clickable");
  if (cell) openPad(cell.dataset.key);
});
$("prev").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderCal(); };
$("next").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderCal(); };

/* ---------- 畫叉 ---------- */
const canvas = $("canvas"), ctx = canvas.getContext("2d");
let strokes = [], current = null, padKey = null, autoTimer = null;

function sizeCanvas() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  redraw();
}
function redraw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#5b8fd6";
  ctx.lineWidth = w * 0.045; ctx.lineCap = "round"; ctx.lineJoin = "round";
  [...strokes, ...(current ? [current] : [])].forEach(s => {
    ctx.beginPath();
    s.forEach((p, i) => i ? ctx.lineTo(p[0]*w, p[1]*h) : ctx.moveTo(p[0]*w, p[1]*h));
    if (s.length === 1) ctx.lineTo(s[0][0]*w + 0.1, s[0][1]*h);
    ctx.stroke();
  });
}
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
          Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
}
canvas.addEventListener("pointerdown", e => {
  clearTimeout(autoTimer);
  canvas.setPointerCapture(e.pointerId);
  current = [pos(e)]; redraw();
});
canvas.addEventListener("pointermove", e => {
  if (!current) return;
  const p = pos(e), last = current[current.length - 1];
  if (Math.hypot(p[0]-last[0], p[1]-last[1]) > 0.005) { current.push(p); redraw(); }
});
const endStroke = () => {
  if (!current) return;
  if (current.length > 2) strokes.push(current);
  current = null; redraw();
  // 畫完兩筆（一個 ✕）自動完成
  if (strokes.length >= 2) autoTimer = setTimeout(finish, 600);
};
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);

function openPad(key) {
  padKey = key;
  const [y, m, d] = key.split("-").map(Number);
  const wk = "日一二三四五六"[new Date(y, m - 1, d).getDay()];
  $("padTitle").textContent = `${m} 月 ${d} 日（${wk}）`;
  $("padNum").textContent = d;
  strokes = (state.marks[key] || []).map(s => s.slice());
  $("btnClear").textContent = state.marks[key] ? "移除 ✕" : "清除";
  $("modal").classList.add("open");
  requestAnimationFrame(sizeCanvas);
}
function closePad() { clearTimeout(autoTimer); $("modal").classList.remove("open"); current = null; }
function finish() {
  clearTimeout(autoTimer);
  if (strokes.length) state.marks[padKey] = strokes.map(s => s.map(p => [+p[0].toFixed(3), +p[1].toFixed(3)]));
  else delete state.marks[padKey];
  const added = strokes.length > 0;
  save(); renderCal(); tick(); closePad();
  if (added) celebrate();
}

/* ---------- 吉祥物 ---------- */
let bubbleTimer = null;
function say(text, ms = 3500) {
  const b = $("bubble");
  b.textContent = text; b.classList.add("show");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove("show"), ms);
}
function daysLeft() { return Math.max(0, Math.ceil((dayStart(target()) - dayStart(new Date())) / 86400000)); }
function hop() {
  const m = $("mascot");
  m.classList.remove("happy"); void m.offsetWidth; m.classList.add("happy");
}
function snow(n = 18) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement("div");
    s.className = "snowfx"; s.textContent = "❄";
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 10 + Math.random() * 14 + "px";
    s.style.animationDuration = 2 + Math.random() * 2 + "s";
    s.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5000);
  }
}
function celebrate() {
  hop(); snow();
  const n = daysLeft();
  const lines = n > 0
    ? [`又劃掉一天！剩 ${n} 天 ✨`, `好棒！再 ${n} 天就到了`, `打叉成功～加油！`]
    : ["就是今天啦！🎉"];
  say(lines[Math.floor(Math.random() * lines.length)]);
}
$("mascot").addEventListener("click", () => {
  hop();
  const n = daysLeft(), todayMarked = !!state.marks[ymd(new Date())];
  const lines = n === 0 ? ["今天就是目標日！🎉"]
    : todayMarked ? [`今天已經劃掉囉，剩 ${n} 天`, "明天見～", "一天一天慢慢來 ☃"]
    : ["今天還沒打叉喔！", `還有 ${n} 天，點今天畫個 ✕ 吧`];
  say(lines[Math.floor(Math.random() * lines.length)]);
});
setTimeout(() => say(state.marks[ymd(new Date())] ? "今天已經劃掉囉 ☃" : `嗨 ${state.user}！還有 ${daysLeft()} 天`), 600);
$("btnDone").onclick = finish;
$("btnCancel").onclick = closePad;
$("btnClear").onclick = () => {
  clearTimeout(autoTimer);
  if (state.marks[padKey] && $("btnClear").textContent === "移除 ✕") {
    delete state.marks[padKey]; save(); renderCal(); tick(); closePad(); return;
  }
  strokes = []; redraw();
};
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closePad(); });
window.addEventListener("resize", () => { if ($("modal").classList.contains("open")) sizeCanvas(); });

/* ---------- 設定 ---------- */
[["inName","name"],["inStart","start"],["inDate","date"],["inTime","time"]].forEach(([id, k]) => {
  $(id).value = state[k];
  $(id).addEventListener("input", e => {
    if ((k === "date" || k === "start") && !e.target.value) return;
    state[k] = e.target.value; save();
    if (k === "date") view = target();
    renderCal(); tick();
  });
});

/* ---------- 問候與名字 ---------- */
if (!state.user) state.user = "YaTsen";
function renderName() { $("who").textContent = state.user; document.title = `Hi ${state.user}・倒數月曆`; }
function editName() {
  const h = $("hello");
  h.innerHTML = `<h2>Hi</h2><input id="nameIn" type="text" maxlength="20" aria-label="名字">
    <button class="icon-btn" id="nameOk">儲存</button><button class="icon-btn" id="nameNo">取消</button>`;
  const inp = $("nameIn"); inp.value = state.user; inp.focus(); inp.select();
  const done = ok => {
    if (ok && inp.value.trim()) { state.user = inp.value.trim(); save(); }
    h.innerHTML = `<h2 id="helloText">Hi <span class="who" id="who"></span> !</h2>
      <button class="icon-btn" id="editName" aria-label="編輯名字">✎ 編輯</button>`;
    $("editName").onclick = editName; renderName();
    if (ok) { hop(); say(`哈囉 ${state.user}！`); }
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); });
  $("nameOk").onclick = () => done(true);
  $("nameNo").onclick = () => done(false);
}
$("editName").onclick = editName;
renderName();

renderCal(); tick(); setInterval(tick, 1000);
</script>
</body>
</html>
